name: Minha pipeline

on:
   push:
     branches; [main]

jobs:
   build-e-teste:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-node@v4
         with:
            node-version: 20
       - run: npm test
       - run: docker build -t meu-app .